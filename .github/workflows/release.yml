name: Release Action

on:
  push:
    tags:
      - 'v*'
  # Also run when a tag is created via the GitHub UI
  create:
  # Also support publishing a GitHub Release and manual runs
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.2.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    # Only proceed for tag events or release publication
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'create' && github.event.ref_type == 'tag') ||
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          EVENT_NAME="${GITHUB_EVENT_NAME}"
          TAG=""
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ "$EVENT_NAME" == "create" ]]; then
            # shell interprets JSON via env file; read ref_type/ref from payload
            REF_TYPE=$(jq -r '.ref_type // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
            if [[ "$REF_TYPE" == "tag" ]]; then
              TAG=$(jq -r '.ref' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
            fi
          elif [[ "$EVENT_NAME" == "release" ]]; then
            TAG=$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # inputs are exported for shell steps
            TAG="${{ inputs.tag }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "Could not determine tag from event context" >&2
            exit 1
          fi
          # Normalize/validate tag format. We enforce a leading 'v' (e.g., v0.2.2).
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Auto-prefix 'v' if omitted for manual runs
            [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          else
            # For tag-driven events we do not mutate; we fail fast if incorrect
            if [[ ! "$TAG" =~ ^v ]]; then
              echo "Tag '$TAG' does not start with 'v'. Please use tags like 'v0.2.2'." >&2
              exit 1
            fi
          fi
          # Optional: minimal semver shape check (major.minor.patch)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not in the form vMAJOR.MINOR.PATCH (e.g., v0.2.2)." >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" | tee -a "$GITHUB_ENV"
      - name: Debug event context
        shell: bash
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF ref_name=$GITHUB_REF_NAME"
          if command -v jq >/dev/null 2>&1; then
            jq '{ref, ref_type, action, release: (.release // {} | {tag_name})}' "$GITHUB_EVENT_PATH" || true
          else
            echo "No jq; raw payload:"; head -c 500 "$GITHUB_EVENT_PATH" || true
          fi
      - name: Extract changelog for tag
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE=".github/release_notes.md"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md not found" >&2
            echo "Release ${RELEASE_TAG}" > "$NOTES_FILE"
          else
            # Extract the section that matches the version heading (e.g., '## 0.2.2')
            awk -v v="$VERSION" '
              BEGIN { printing=0 }
              /^##[[:space:]]*/ {
                # Capture version token after heading
                line=$0
                sub(/^##[[:space:]]*/, "", line)
                split(line, a, /[[:space:]]+/)
                hv=a[1]
                if (printing) { exit } # reached next section; stop
                if (hv==v) { printing=1 }
              }
              { if (printing) print }
              END { if (!printing) exit 1 }
            ' CHANGELOG.md > "$NOTES_FILE" || {
              # Fallback: take the first section after the top title
              awk '
                BEGIN { started=0 }
                /^##[[:space:]]+/ { if (started) exit; started=1 }
                { if (started) print }
              ' CHANGELOG.md > "$NOTES_FILE" || echo "Release ${RELEASE_TAG}" > "$NOTES_FILE"
            }
          fi
          echo "Wrote release notes to $NOTES_FILE"
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: 'wm.spoon.zip'
          path: 'wm/'
      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'wm.spoon.zip'
          tag: ${{ env.RELEASE_TAG }}
          allowUpdates: true
          bodyFile: '.github/release_notes.md'
